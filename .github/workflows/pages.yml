name: Pages

# Publishes two pages, and nothing else, to GitHub Pages:
# docs/home/index.html becomes https://lokim-dj.github.io/seogi/ (the app's
# homepage on Google's sign-in screen) and docs/privacy/index.html becomes
# https://lokim-dj.github.io/seogi/privacy/. Only those two files are copied
# into the site, so the rest of docs/ (release notes, decisions, plans) never
# becomes a page. Needs Pages turned on with
# "GitHub Actions" as its source (Settings > Pages).

on:
  push:
    branches: [main]
    paths:
      - docs/home/**
      - docs/privacy/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Built and deployed in two jobs, as GitHub's own Pages template does: in
  # one job deploy-pages often could not find the artifact it had just been
  # given ("No artifacts named github-pages were found") and failed.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Site with the home and privacy pages only
        run: |
          mkdir -p _site/privacy
          cp docs/home/index.html _site/index.html
          cp docs/privacy/index.html _site/privacy/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
