name: Build

# Builds the two platforms Seogi ships for: Windows x64 (NSIS installer) and
# Apple Silicon macOS (dmg). Windows is unsigned. macOS is signed with Seogi's
# own self-signed certificate (no Apple account, so no notarization): the same
# signature every version, so macOS keeps its permissions across updates.
# Without the certificate's secrets (a fork) it falls back to ad-hoc. The
# Windows job also installs the result silently and runs it headless, so a
# broken package fails here.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/**"

# Called from Release, github.workflow is "Release", so a push to main while a
# release is building starts its own group instead of cancelling the release.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64
          cache-bin: false

      # ggml's Vulkan backend (the Windows GPU path) needs the SDK's headers and glslc.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan does find_package(SPIRV-Headers CONFIG REQUIRED); the SDK
      # install above does not expose a findable config, so take it from vcpkg.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # The VC++ runtime ships beside the exe, so the app starts on machines
      # with no redistributable installed. build.rs stages the DLLs from here.
      - name: Locate VC++ runtime redist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ redist dirs not found under $archDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - run: bun install --frozen-lockfile

      # The updater's signature is made with Seogi's own key, which lives in
      # the repository's secrets (and on the maintainer's computer only).
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis

      - name: Install silently and run headless
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $pkg) { throw "No NSIS installer was produced" }
          $installDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $installDir | Out-Null
          $proc = Start-Process -FilePath $pkg.FullName -ArgumentList @("/S", "/PORTABLE", "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent install failed with exit code $($proc.ExitCode)" }
          $exe = Get-ChildItem $installDir -Filter "seogi.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed package has no seogi.exe" }
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcomp140.dll")) {
            if (-not (Get-ChildItem $installDir -Filter $dll -Recurse)) { throw "Installed package is missing $dll" }
          }
          $devices = (& $exe.FullName --list-devices | Out-String)
          $devices | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "seogi.exe --list-devices failed" }
          if ($devices -notmatch "kind=cpu") { throw "No CPU compute device was registered" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seogi-windows-x64
          # The installer is also what the updater runs; .sig is its signature.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

  macos:
    name: macOS Apple Silicon
    # macOS 15 runners are always available; the macOS 26 ones were not
    # (two of four runs were cancelled waiting for one). Their SDK lacks
    # FoundationModels, so the Apple Intelligence bridge is built as stubs,
    # which Seogi does not use.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64
          cache-bin: false

      - run: bun install --frozen-lockfile

      # macOS ties permissions such as Accessibility to the app's designated
      # requirement. Ad-hoc signing changes it every build, so each update
      # lost the permission. The certificate goes into a throwaway keychain
      # and Tauri signs with it by APPLE_SIGNING_IDENTITY. APPLE_CERTIFICATE
      # is kept away from Tauri on purpose: its own import only accepts
      # Apple-issued certificate names. No APPLE_ID, so nothing is notarized.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # "Release" when called from the release workflow (see concurrency).
          CALLED_BY: ${{ github.workflow }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            # A release signed ad-hoc would make every Mac ask for its
            # permissions again, so a release stops here instead.
            if [ "$CALLED_BY" = "Release" ]; then
              echo "::error::A release must be signed: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are all needed"
              exit 1
            fi
            echo "No signing certificate in this run's secrets; the app is signed ad-hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/seogi-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/seogi-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/seogi-signing.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/seogi-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -p codesigning "$keychain" | grep -q "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY is not in the imported certificate"
            exit 1
          fi
          echo "SEOGI_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target aarch64-apple-darwin --bundles app,dmg

      # The release's files, side by side in one folder (an artifact keeps
      # the folders of its files). The updater takes the app as a signed
      # archive, named by its version like the installer.
      - name: Gather the release files
        run: |
          version="$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)"
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p release-files
          cp "$bundle"/dmg/*.dmg release-files/
          cp "$bundle/macos/Seogi.app.tar.gz" "release-files/Seogi_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/Seogi.app.tar.gz.sig" "release-files/Seogi_${version}_aarch64.app.tar.gz.sig"
          ls -la release-files

      - name: Run headless
        run: |
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          "$app/Contents/MacOS/seogi" --list-devices

      # The designated requirement must name the certificate (certificate
      # leaf = H"..."), not a hash of this build's code, or the next update
      # loses the Accessibility permission again.
      - name: Show the signature
        run: |
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          if [ -n "${SEOGI_SIGNING_KEYCHAIN:-}" ] && ! echo "$requirement" | grep -q 'certificate leaf = H"'; then
            echo "::error::The app is not signed with the certificate"
            exit 1
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SEOGI_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SEOGI_SIGNING_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seogi-macos-arm64
          path: release-files/*
          retention-days: 30
