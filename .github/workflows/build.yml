name: Build

# Builds the two platforms Seogi ships for: Windows x64 (NSIS installer) and
# Apple Silicon macOS (dmg). Both are unsigned. The Windows job also installs
# the result silently and runs it headless, so a broken package fails here.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64
          cache-bin: false

      # ggml's Vulkan backend (the Windows GPU path) needs the SDK's headers and glslc.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan does find_package(SPIRV-Headers CONFIG REQUIRED); the SDK
      # install above does not expose a findable config, so take it from vcpkg.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # The VC++ runtime ships beside the exe, so the app starts on machines
      # with no redistributable installed. build.rs stages the DLLs from here.
      - name: Locate VC++ runtime redist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ redist dirs not found under $archDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - run: bun install --frozen-lockfile

      # The updater's signature is made with Seogi's own key, which lives in
      # the repository's secrets (and on the maintainer's computer only).
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis

      - name: Install silently and run headless
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $pkg) { throw "No NSIS installer was produced" }
          $installDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $installDir | Out-Null
          $proc = Start-Process -FilePath $pkg.FullName -ArgumentList @("/S", "/PORTABLE", "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent install failed with exit code $($proc.ExitCode)" }
          $exe = Get-ChildItem $installDir -Filter "seogi.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed package has no seogi.exe" }
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcomp140.dll")) {
            if (-not (Get-ChildItem $installDir -Filter $dll -Recurse)) { throw "Installed package is missing $dll" }
          }
          $devices = (& $exe.FullName --list-devices | Out-String)
          $devices | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "seogi.exe --list-devices failed" }
          if ($devices -notmatch "kind=cpu") { throw "No CPU compute device was registered" }

      - uses: actions/upload-artifact@v7
        with:
          name: seogi-windows-x64
          # The installer is also what the updater runs; .sig is its signature.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

  macos:
    name: macOS Apple Silicon
    # macOS 15 runners are always available; the macOS 26 ones were not
    # (two of four runs were cancelled waiting for one). Their SDK lacks
    # FoundationModels, so the Apple Intelligence bridge is built as stubs,
    # which Seogi does not use.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64
          cache-bin: false

      - run: bun install --frozen-lockfile

      - name: Build dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target aarch64-apple-darwin --bundles app,dmg

      # The release's files, side by side in one folder (an artifact keeps
      # the folders of its files). The updater takes the app as a signed
      # archive, named by its version like the installer.
      - name: Gather the release files
        run: |
          version="$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)"
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p release-files
          cp "$bundle"/dmg/*.dmg release-files/
          cp "$bundle/macos/Seogi.app.tar.gz" "release-files/Seogi_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/Seogi.app.tar.gz.sig" "release-files/Seogi_${version}_aarch64.app.tar.gz.sig"
          ls -la release-files

      - name: Run headless
        run: |
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          "$app/Contents/MacOS/seogi" --list-devices

      - uses: actions/upload-artifact@v7
        with:
          name: seogi-macos-arm64
          path: release-files/*
          retention-days: 30
