name: Check

# Runs on every pull request and on main: the quick checks and the dependency
# advisories on Linux ("text"), the Rust tests on macOS ("rust"), and the
# Android app's unit tests and debug build ("android", no signing key here).
# All must be green before a pull request is merged (see AGENTS.md, How work
# lands). The
# name check against the maintainer's private lists cannot run here; the
# pre-push hook runs it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text:
    name: text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Public text
        run: bun run check:public
      - name: Public text check's own tests
        run: bun run test:public
      - name: Version and release notes
        run: bun run check:version
      - name: Formatting (Prettier, cargo fmt)
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Types
        run: bunx tsc --noEmit
      - name: Translations
        run: bun run check:translations
      - name: Model catalog copy
        run: bun run check:catalog
      # Known advisories in the npm and Rust parts: a high or critical one
      # fails unless scripts/check-deps.ts lists it with a reason; anything
      # lower is a warning.
      - name: Install cargo-audit
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit
      - name: Dependency check's own tests
        run: bun run test:deps
      - name: Dependency advisories (bun audit, cargo audit)
        run: bun run check:deps

  rust:
    name: rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          key: check-macos
          cache-bin: false
      - run: bun install --frozen-lockfile
      # The app embeds the built frontend (frontendDist), so it must exist
      # before the crate compiles.
      - name: Build the frontend
        run: bun run build
      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri

  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Gradle wrapper jar in the repository is Gradle's own, by checksum.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Robolectric fetches its Android jar (~150 MB) from Maven Central on the
      # first test run, and a dropped download has failed main more than once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      # The runner image carries the Android SDK (platform 35, build-tools
      # 35.0.0). The wrapper checks the Gradle download against its SHA-256.
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
