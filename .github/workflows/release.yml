name: Release

# Run by hand: builds both platforms from the chosen ref, then makes a GitHub
# Release named after the version in tauri.conf.json. The release is a draft
# (seen only by the repository's owners) unless "publish" is ticked, so the
# installers can be tried before anyone else sees them. Installed copies
# learn of a version only once its release is published (latest.json of the
# latest release).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish at once instead of leaving a draft"
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # The updater's signing key.
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement from GitHub that these files
      # came out of this workflow run, from this repository and commit.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # Anyone can check a downloaded file with
      # gh attestation verify <file> -R lokim-dj/seogi
      - name: Attest the installers' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*-setup.exe
            artifacts/*.app.tar.gz

      # The release's text: the notes of this version, then each installer's
      # SHA-256 and how to check it. The file in docs/ stays as written (the
      # updater shows it as is). The virus scan link is added by hand after
      # the release (docs/RELEASING.md).
      - name: Write the release text
        run: |
          version="$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)"
          body="$RUNNER_TEMP/release-notes.md"
          cp "docs/release-notes/v${version}.md" "$body"
          {
            echo
            echo "## 설치 파일 검사"
            echo
            echo '받은 파일이 이 판의 것인지 SHA-256 값으로 맞춰 볼 수 있습니다. macOS 는 터미널에서 `shasum -a 256 파일이름`, Windows 는 PowerShell 에서 `Get-FileHash 파일이름` 으로 값을 내어 아래와 같은지 봅니다.'
            echo
            echo "| 파일 | SHA-256 |"
            echo "| --- | --- |"
            for file in artifacts/*.dmg artifacts/*-setup.exe artifacts/*.app.tar.gz; do
              test -f "$file" || { echo "missing $file" >&2; exit 1; }
              echo "| \`$(basename "$file")\` | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            echo '이 파일들이 이 저장소의 Release 작업에서 만들어졌다는 GitHub 의 빌드 출처 증명도 붙어 있습니다. GitHub CLI 가 있으면 `gh attestation verify 파일이름 -R lokim-dj/seogi` 로 확인합니다.'
          } >> "$body"
          cat "$body"

      # What an installed Seogi reads to learn of a new version: the version,
      # what changed, and for each platform the file and its signature.
      - name: Write latest.json
        run: |
          version="$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          mac="Seogi_${version}_aarch64.app.tar.gz"
          win="Seogi_${version}_x64-setup.exe"
          ls -la artifacts
          for file in "$mac" "$mac.sig" "$win" "$win.sig"; do
            test -f "artifacts/$file" || { echo "missing $file"; exit 1; }
          done
          jq -n \
            --arg version "$version" \
            --arg notes "$(cat docs/release-notes/v${version}.md)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" --rawfile mac_sig "artifacts/$mac.sig" \
            --arg win_url "$base/$win" --rawfile win_sig "artifacts/$win.sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
               "windows-x86_64": {url: $win_url, signature: $win_sig}}}' \
            > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)"
          ls -la artifacts
          draft="--draft"
          if [ "${{ inputs.publish }}" = "true" ]; then draft=""; fi
          # A draft of this version from an earlier run is brought up to
          # date instead of failing because it exists. A draft has no tag
          # yet, so it is looked up among the releases by its name.
          existing="$(gh release list --limit 50 --json name,isDraft,tagName \
            --jq ".[] | select(.isDraft and .name == \"서기 v${version}\") | .tagName" | head -1)"
          if [ -n "$existing" ]; then
            gh release upload "$existing" artifacts/* --clobber
            gh release edit "$existing" --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "${GITHUB_SHA}" ${draft:+--draft}
          else
            gh release create "v${version}" artifacts/* $draft \
              --title "서기 v${version}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "${GITHUB_SHA}"
          fi
